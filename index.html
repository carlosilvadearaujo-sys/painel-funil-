<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Funil"><title>Painel Funil</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="stylesheet" href="/style.css?v=11"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><section id="loginScreen" class="login-screen"><form id="loginForm" class="login-box"><small>ACESSO RESTRITO</small><h1>Painel Funil</h1><input id="loginEmail" type="hidden" value="mayapavonipriv@gmail.com"><label>Senha<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="save" type="submit">Entrar</button><span id="loginMsg"></span></form></section><main id="app" class="wrap hidden"><header><div><small>CONTROLE DE AQUISIÇÃO</small><h1>Painel Funil</h1></div><div><button class="mini" id="logoutBtn">Sair</button> <button id="newBtn">+ Registro</button></div></header><section class="filters"><button data-days="7">7 dias</button><button data-days="30" class="active">30 dias</button><button data-days="99999">Tudo</button></section><section id="cards" class="cards"></section><section class="panel"><div class="panelhead"><h2>Funil</h2><span id="loss"></span></div><div id="funnel"></div></section><section class="panel"><div class="panelhead"><h2>TikTok × Instagram</h2></div><div id="compare" class="compare"></div></section><section class="panel"><div class="panelhead"><h2>Histórico</h2><div><button class="mini" id="toolsBtn">Detalhes</button> <span id="count"></span></div></div><div id="history"></div><div id="details" class="hidden details"><div class="detailblock"><div class="panelhead"><h2>Evolução</h2><span id="trendLabel"></span></div><div id="trend" class="compare"></div></div><div class="detailblock"><div class="panelhead"><h2>Metas Telegram</h2><button class="mini" id="goalBtn">Editar</button></div><div id="goals"></div></div><div class="detailblock"><div class="panelhead"><h2>Desempenho diário</h2></div><div class="chartwrap"><canvas id="chart" width="900" height="240"></canvas></div></div><div class="detailblock"><div class="panelhead"><h2>Publicações</h2><div><button class="mini" id="importBtn">Importar CSV</button> <button class="mini" id="exportBtn">CSV</button></div></div><input id="importFile" class="hidden" type="file" accept=".csv,text/csv"><div id="ranking"></div></div></div></section></main><dialog id="modal"><form id="form"><div class="modalhead"><h2>Novo registro</h2><button type="button" id="close">×</button></div><input type="hidden" id="editId"><label>Data<input id="date" type="date" required></label><label>Plataforma<select id="platform"><option>TikTok</option><option>Instagram</option></select></label><label>Vídeo / identificação (opcional)<input id="video" placeholder="Ex.: Vídeo 12"></label><div class="grid"><label>Visualizações<input id="views" type="number" min="0" required></label><label>Visitas ao perfil<input id="profile" type="number" min="0" required></label><label>Cliques no link<input id="clicks" type="number" min="0" required></label><label>Entradas Telegram<input id="telegram" type="number" min="0" required></label></div><div class="modalactions"><button id="deleteBtn" type="button" class="danger hidden">Excluir registro</button><button class="save" type="submit">Salvar registro</button></div><span id="formMsg"></span></form></dialog><dialog id="goalModal"><form id="goalForm"><div class="modalhead"><h2>Metas Telegram</h2><button type="button" id="goalClose">×</button></div><label>Meta diária<input id="dailyGoal" type="number" min="0" required></label><label>Meta semanal<input id="weeklyGoal" type="number" min="0" required></label><button class="save" type="submit">Salvar metas</button></form></dialog><script src="/app.js?v=11"></script></body></html>
