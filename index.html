<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><meta name="apple-mobile-web-app-capable" content="yes"><title>Painel Funil</title><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><section id="auth" class="auth"><form id="loginForm" class="authbox"><small>ACESSO PRIVADO</small><h1>Painel Funil</h1><p>Entre para acessar seus dados.</p><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Senha" minlength="6" required><button class="save">Entrar</button><button type="button" id="signupBtn" class="secondary">Criar meu acesso</button><span id="authMsg"></span></form></section><main id="app" class="wrap hidden"><header><div><small>CONTROLE DE AQUISIÇÃO</small><h1>Painel Funil</h1></div><div class="actions"><button id="exportBtn">CSV</button><button id="logoutBtn">Sair</button><button id="newBtn">+ Registro</button></div></header><section class="filters"><button data-days="7">7 dias</button><button data-days="30" class="active">30 dias</button><button data-days="99999">Tudo</button></section><section id="cards" class="cards"></section><section class="panel"><div class="panelhead"><h2>Comparação com período anterior</h2></div><div id="trend" class="compare"></div></section><section class="panel"><div class="panelhead"><h2>Funil</h2><span id="loss"></span></div><div id="funnel"></div></section><section class="panel"><div class="panelhead"><h2>Desempenho diário</h2></div><div class="chartwrap"><canvas id="chart" width="900" height="260"></canvas></div></section><section class="panel"><div class="panelhead"><h2>Metas Telegram</h2><button id="goalBtn">Editar metas</button></div><div id="goals"></div></section><section class="panel"><div class="panelhead"><h2>TikTok × Instagram</h2></div><div id="compare" class="compare"></div></section><section class="panel"><div class="panelhead"><h2>Publicações</h2><span>por entradas no Telegram</span></div><div id="ranking"></div></section><section class="panel"><div class="panelhead"><h2>Histórico</h2><span id="count"></span></div><div id="history"></div></section></main><dialog id="modal"><form id="form"><div class="modalhead"><h2>Registro</h2><button type="button" id="close">×</button></div><input type="hidden" id="editId"><label>Data<input id="date" type="date" required></label><label>Plataforma<select id="platform"><option>TikTok</option><option>Instagram</option></select></label><label>Vídeo / identificação<input id="video" placeholder="Ex.: Vídeo 12"></label><div class="grid"><label>Visualizações<input id="views" type="number" min="0" required></label><label>Visitas ao perfil<input id="profile" type="number" min="0" required></label><label>Cliques no link<input id="clicks" type="number" min="0" required></label><label>Entradas Telegram<input id="telegram" type="number" min="0" required></label></div><div class="modalactions"><button id="deleteBtn" type="button" class="danger hidden">Excluir</button><button class="save" type="submit">Salvar</button></div><span id="formMsg"></span></form></dialog><dialog id="goalModal"><form id="goalForm"><div class="modalhead"><h2>Metas</h2><button type="button" id="goalClose">×</button></div><label>Meta diária<input id="dailyGoal" type="number" min="0" required></label><label>Meta semanal<input id="weeklyGoal" type="number" min="0" required></label><button class="save" type="submit">Salvar metas</button></form></dialog><script src="/app.js"></script></body></html>
